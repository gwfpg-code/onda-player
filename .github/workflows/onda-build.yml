name: 'Onda Player - build'

# Costruisce gli installer di Onda Player senza firma digitale:
#   - Linux: .deb (Debian/Ubuntu, mini PC)
#   - Windows: .msi
# Parte con un tag "v*" (es. v4.0.13-onda.1) e allega i file alla release; a mano (Actions › Run
# workflow) li lascia come artefatti scaricabili. Il workflow originale di Xibo (firma Azure, Snap
# Store) è stato tolto: usa segreti che solo Xibo possiede.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  WIX_VERSION: '6.0.0'

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - run: npm run build
      - run: npx electron-forge make --platform linux --arch x64 --targets @electron-forge/maker-deb
      - uses: actions/upload-artifact@v4
        with: { name: onda-player-linux, path: 'out/make/deb/x64/*.deb' }
      - name: Allegato alla release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with: { files: 'out/make/deb/x64/*.deb' }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - uses: ilammy/msvc-dev-cmd@v1
      - name: WiX
        shell: powershell
        run: |
          dotnet tool install --global wix --version $env:WIX_VERSION
          wix extension add -g WixToolset.UI.wixext/$env:WIX_VERSION
      - run: npm ci
        shell: powershell
      - name: TightVNC (server VNC del controllo remoto, GPLv2)
        shell: powershell
        run: |
          $v = '2.8.85'
          $sha = 'd8fbed7b27ebab86df6f780f6e86f723668f3715cee521ccaa4568812aef5f3e'
          # fuori dalla cartella del progetto: altrimenti il pacchetto e i file estratti finiscono dentro l'app
          $msi = Join-Path $env:RUNNER_TEMP 'tvnc.msi'
          $dir = Join-Path $env:RUNNER_TEMP 'tvnc'
          Invoke-WebRequest "https://www.tightvnc.com/download/$v/tightvnc-$v-gpl-setup-64bit.msi" -OutFile $msi
          if ((Get-FileHash $msi -Algorithm SHA256).Hash.ToLower() -ne $sha) { throw 'TightVNC: impronta SHA-256 diversa' }
          Start-Process msiexec.exe -Wait -ArgumentList '/a', $msi, '/qn', "TARGETDIR=$dir"
          $src = Get-ChildItem $dir -Recurse -Filter tvnserver.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force installer/vnc | Out-Null
          foreach ($f in 'tvnserver.exe', 'hookldr.exe', 'screenhooks32.dll', 'screenhooks64.dll', 'sas.dll', 'LICENSE.txt') {
            Copy-Item (Join-Path $src.DirectoryName $f) installer/vnc/
          }
          Get-ChildItem installer/vnc
      - run: npm run build
        shell: powershell
      - run: npx electron-forge make --platform win32 --arch x64
        shell: powershell
      - uses: actions/upload-artifact@v4
        with: { name: onda-player-windows, path: 'out/make/**/*.msi' }
      - name: Allegato alla release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with: { files: 'out/make/**/*.msi' }
